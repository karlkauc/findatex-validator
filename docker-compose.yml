services:
  findatex-web:
    build:
      context: .
      dockerfile: Dockerfile
      # Surfaced to /api/build-info via BUILD_GIT_COMMIT / BUILD_TIME env vars
      # in the final stage. Set on the host before invoking compose:
      #   GIT_COMMIT=$(git rev-parse HEAD) \
      #   BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
      #   docker compose up -d --build
      # Empty defaults keep `docker compose up` working without any preamble —
      # the endpoint then reports an empty commit, same as before this hook.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
      # MaxMind GeoLite2 license key for the build-time GeoIP DB download (see
      # the Dockerfile "geoip" stage). Sourced from MAXMIND_LICENSE_KEY in the
      # environment / .env. Unset ⇒ download skipped, country_code stays NULL,
      # image still builds. Requires BuildKit (default in modern Docker).
      secrets:
        - maxmind_license_key
    image: findatex-validator-web:1.0.0
    container_name: findatex-validator-web
    ports:
      # Host 18082 → container 8080 (host's :8080 is taken by other services).
      - "127.0.0.1:18082:8080"
    restart: unless-stopped
    # --- Container hardening ---------------------------------------------------
    # App needs no Linux caps (no <1024 bind, no raw sockets), no privilege
    # escalation, and no writes outside /tmp + the mounted cache volume.
    read_only: true
    tmpfs:
      # Holds Quarkus upload tempfiles, POI scratch (poifiles) and the report
      # XLSX simultaneously — 64m overflows (ENOSPC) on large real-world funds.
      - /tmp:exec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      # --- Throttling --------------------------------------------------------
      # Conservative no-login default — if an operator fronts the service with
      # auth or a WAF and wants to lift the cap, they raise this per-deploy.
      FINDATEX_WEB_RATE_LIMIT_PER_IP_PER_HOUR: "60"
      FINDATEX_WEB_MAX_CONCURRENCY: "8"
      FINDATEX_WEB_REPORT_TTL_MINUTES: "5"

      # --- External validation -----------------------------------------------
      # GLEIF (LEI) needs no key. OpenFIGI works without a key at 4 req/s; with
      # a key it goes up to 100 req/s. Users may also bring their own OpenFIGI
      # key per request — that one is never persisted.
      FINDATEX_WEB_EXTERNAL_ENABLED: "true"
      # Persistent cache dir (mounted as a named volume below — survives restarts).
      FINDATEX_WEB_EXTERNAL_CACHE_DIR: "/data/cache"
      # FINDATEX_WEB_EXTERNAL_OPENFIGI_KEY: "your-key"
      # FINDATEX_WEB_EXTERNAL_PROXY_MODE: "MANUAL"
      # FINDATEX_WEB_EXTERNAL_PROXY_HOST: "proxy.example.com"
      # FINDATEX_WEB_EXTERNAL_PROXY_PORT: "8080"
      # FINDATEX_WEB_EXTERNAL_PROXY_USERNAME: "svc-findatex"
      # FINDATEX_WEB_EXTERNAL_PROXY_PASSWORD: "your-password"
      # FINDATEX_WEB_EXTERNAL_PROXY_NON_PROXY_HOSTS: "localhost,*.internal"

      # --- Anonymous usage statistics (Postgres) -----------------------------
      # Schema must be created once in the DB (see docs/USAGE_STATS.md).
      # Secrets are pulled from .env (gitignored). Empty .env values ⇒ the
      # datasource stays inert and the app still boots normally.
      FINDATEX_WEB_USAGE_DB_URL: "${FINDATEX_WEB_USAGE_DB_URL:-}"
      FINDATEX_WEB_USAGE_DB_USER: "${FINDATEX_WEB_USAGE_DB_USER:-}"
      FINDATEX_WEB_USAGE_DB_PASSWORD: "${FINDATEX_WEB_USAGE_DB_PASSWORD:-}"
      FINDATEX_WEB_USAGE_STATS_INGEST_TOKEN: "${FINDATEX_WEB_USAGE_STATS_INGEST_TOKEN:-}"
      # Keys the daily-rotating visitor hash of web events; must be the same on
      # every instance. Empty = per-process random salt (counts approximate).
      FINDATEX_WEB_VISITOR_SALT_SECRET: "${FINDATEX_WEB_VISITOR_SALT_SECRET:-}"
      # Optional: per-IP rate limit on /api/usage-stats (default 60/h).
      # FINDATEX_WEB_USAGE_STATS_RATE: "60"
      # GeoIP country derivation: the GeoLite2-Country.mmdb is baked into the
      # image at /data/geoip by the Dockerfile "geoip" stage (gated on the
      # maxmind_license_key build secret), and FINDATEX_WEB_GEOIP_DB is already
      # set in the image — no override needed here. NOTE: behind a real reverse
      # proxy, also set PROXY_ADDRESS_FORWARDING=true and PROXY_ALLOW_X_FORWARDED=true
      # so the lookup sees the client IP rather than the proxy's (see
      # application.properties proxy block). This compose stack talks to the
      # container directly, so they stay off here.

    volumes:
      # GLEIF/OpenFIGI lookup cache. Persisting it across restarts avoids
      # re-fetching every LEI/ISIN every time the container is recreated.
      - findatex-cache:/data/cache

    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: "2.0"
        reservations:
          memory: 512M

    healthcheck:
      # BusyBox wget is bundled in alpine:3.23 — exits 0 on 2xx, non-zero on >=400.
      # Health endpoint moved to /_internal/health/* (out of the public /q/* namespace).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/_internal/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  findatex-cache:

secrets:
  # MaxMind GeoLite2 license key, read from the MAXMIND_LICENSE_KEY env var
  # (set it in .env, which is gitignored). Only consumed at image build time by
  # the Dockerfile "geoip" stage; never written into a layer or the running
  # container. Absent/empty ⇒ GeoIP DB download is skipped.
  maxmind_license_key:
    environment: MAXMIND_LICENSE_KEY
